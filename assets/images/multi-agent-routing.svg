<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-bearing multi-agent orchestration</title>
  <desc id="desc">A coordinator turns a goal into a task graph, routes independent work to isolated lanes, and accepts only evidence-backed results through a verifier.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2}.soft{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.lane{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.verify{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.t{font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.s{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.tiny{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#m)}.dash{stroke:#ea580c;stroke-width:2;stroke-dasharray:8 7;fill:none}.label{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c2410c}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720" rx="24"/>
  <text class="t" x="56" y="58">Reliable parallelism routes work; it does not redefine correctness.</text>
  <rect class="soft" x="56" y="102" width="230" height="110" rx="16"/>
  <text class="t" x="86" y="145">Goal + contract</text>
  <text class="s" x="86" y="175">Outcome, limits, policy</text>
  <text class="s" x="86" y="198">and proof required</text>
  <rect class="box" x="370" y="92" width="260" height="130" rx="16"/>
  <text class="t" x="402" y="136">Coordinator</text>
  <text class="s" x="402" y="166">Task graph + mailbox</text>
  <text class="s" x="402" y="192">Leases + cancellation</text>
  <path class="arrow" d="M286 157 H360"/>

  <rect class="lane" x="728" y="86" width="210" height="118" rx="16"/>
  <text class="t" x="764" y="130">Worker A</text>
  <text class="s" x="764" y="160">Fresh context</text>
  <text class="s" x="764" y="184">Owned artifact</text>
  <rect class="lane" x="728" y="250" width="210" height="118" rx="16"/>
  <text class="t" x="764" y="294">Worker B</text>
  <text class="s" x="764" y="324">Fresh context</text>
  <text class="s" x="764" y="348">Owned artifact</text>
  <rect class="lane" x="728" y="414" width="210" height="118" rx="16"/>
  <text class="t" x="764" y="458">Worker C</text>
  <text class="s" x="764" y="488">Fresh context</text>
  <text class="s" x="764" y="512">Owned artifact</text>
  <path class="arrow" d="M630 130 C680 130 680 145 718 145"/>
  <path class="arrow" d="M630 157 C680 157 680 309 718 309"/>
  <path class="arrow" d="M630 184 C680 184 680 473 718 473"/>

  <rect class="verify" x="1020" y="248" width="210" height="124" rx="16"/>
  <text class="t" x="1051" y="292">Verifier</text>
  <text class="s" x="1051" y="322">Tests world state</text>
  <text class="s" x="1051" y="347">Accepts or reopens</text>
  <path class="arrow" d="M938 145 C980 145 980 272 1010 287"/>
  <path class="arrow" d="M938 309 H1010"/>
  <path class="arrow" d="M938 473 C980 473 980 348 1010 333"/>

  <rect class="warn" x="334" y="554" width="640" height="108" rx="16"/>
  <text class="t" x="368" y="596">Shared mutable resources</text>
  <text class="s" x="368" y="626">One checkout, browser session, display, account, or external record</text>
  <text class="s" x="368" y="650">must have one owner at a time: lease, serialize, verify, release.</text>
  <path class="dash" d="M500 222 V544"/>
  <path class="dash" d="M833 532 V544"/>
  <text class="label" x="510" y="402">serialize at the resource boundary</text>

  <text class="tiny" x="56" y="697">Design invariant: parallel across independent lanes; serialized within shared state; evidence at every join.</text>
</svg>
